<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Classical Library</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1 id="site-title">Classical Library</h1>
      <p id="site-tagline"></p>
    </div>
    <input id="search" type="search" placeholder="Search composer, work, performer…" autocomplete="off">
  </header>

  <div class="layout">
    <nav class="composers" aria-label="Composers">
      <ul id="composer-list"></ul>
    </nav>
    <main>
      <p id="status" class="status">Loading library…</p>
      <div id="works" class="works"></div>
    </main>
  </div>

  <footer class="player" aria-label="Player">
    <div class="now">
      <div id="now-title" class="now-title">Nothing playing</div>
      <div id="now-sub" class="now-sub">Pick a movement to start</div>
    </div>
    <div class="controls">
      <button id="prev" aria-label="Previous">⏮</button>
      <button id="play" class="play" aria-label="Play">▶</button>
      <button id="next" aria-label="Next">⏭</button>
    </div>
    <div class="seek">
      <span id="time-cur">0:00</span>
      <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek">
      <span id="time-dur">0:00</span>
    </div>
    <div class="volume">
      <input id="volume" type="range" min="0" max="1" step="0.01" value="1" aria-label="Volume">
      <span id="source-badge" class="badge"></span>
    </div>
  </footer>

  <div id="toast" class="toast" role="status" hidden></div>
  <audio id="audio" preload="metadata"></audio>
  <script src="app.js"></script>
</body>
</html>
