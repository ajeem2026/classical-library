<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inside Jeem’s head</title>
  <meta name="description" content="A personal classical music player: public-domain Musopen recordings, heard inside my head.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <!-- Clefs, fermata and accidentals for the engraved fragments, subset to just those glyphs. -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Music&text=%F0%9D%84%9E%F0%9D%84%A2%F0%9D%84%90%E2%99%AF%E2%99%AD&display=block" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
</head>
<body>
  <div class="app">
    <section class="stage" aria-label="Now playing">
      <h1 id="site-title" class="wordmark">Inside Jeem’s head</h1>
      <a class="stage-nav" href="listening.html">The listening ledger</a>

      <!-- Phase (a) placeholder: replaced by the WebGL head in phase (b). -->
      <div id="stage-canvas" class="stage-canvas" aria-hidden="true">
        <svg class="placeholder-head" viewBox="0 0 400 520">
          <defs>
            <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-28)">
              <line x1="0" y1="0" x2="0" y2="7" stroke="currentColor" stroke-width="1.1" />
            </pattern>
            <clipPath id="head-clip">
              <path d="M200 18c-92 0-158 66-160 170-1 52 10 96 26 136 14 36 30 70 50 96 22 30 50 66 84 70 34-4 62-40 84-70 20-26 36-60 50-96 16-40 27-84 26-136C358 84 292 18 200 18z" />
            </clipPath>
          </defs>
          <rect width="400" height="520" fill="url(#hatch)" clip-path="url(#head-clip)" />
        </svg>
      </div>

      <div class="caption" aria-live="polite">
        <p id="caption-composer" class="caption-composer"></p>
        <h2 id="caption-work" class="caption-work">Choose a work to begin</h2>
        <p id="caption-move" class="caption-move"></p>
        <p id="caption-note" class="caption-note">Twenty-four works recorded for Musopen and released to the public domain. Pick one from the list.</p>
        <button type="button" id="dream-replay" class="dream-replay" hidden>Replay the dream</button>
      </div>
    </section>

    <aside class="library" aria-label="Library">
      <div class="drawer" role="search">
        <div class="drawer-label"><span>Card catalogue</span> <span id="drawer-count"></span></div>
        <div class="drawer-card">
          <input id="search" type="search" placeholder="Composer, work or movement" aria-label="Search the library" autocomplete="off">
          <button id="fav-filter" class="fav-filter" aria-pressed="false">Favourites</button>
          <button id="sfx-toggle" class="sfx-toggle" aria-pressed="true" title="Sound effects">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path class="waves" d="M15.5 9a4.5 4.5 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11"/><path class="mute" d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
            <span class="sr-only">Sound effects</span>
          </button>
        </div>
      </div>
      <p id="status" class="status">Loading library…</p>
      <div id="works" class="shelves"></div>
      <p class="credit">Recordings: Musopen, <a href="https://archive.org/details/MusopenKickstarterRecordings" target="_blank" rel="noopener">CC0 via archive.org</a>.</p>
    </aside>

    <footer class="player" aria-label="Player">
      <div class="now">
        <div id="now-title" class="now-title">Nothing playing</div>
        <div id="now-sub" class="now-sub">Pick a movement to start</div>
      </div>
      <div class="controls">
        <button id="prev" aria-label="Previous">⏮</button>
        <button id="play" class="play" aria-label="Play">▶</button>
        <button id="next" aria-label="Next">⏭</button>
      </div>
      <div class="seek">
        <span id="time-cur">0:00</span>
        <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek">
        <span id="time-dur">0:00</span>
      </div>
      <div class="volume">
        <input id="volume" type="range" min="0" max="1" step="0.01" value="1" aria-label="Volume">
        <span id="source-badge" class="badge"></span>
      </div>
    </footer>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>
  <audio id="audio" preload="metadata"></audio>
  <script src="sfx.js"></script>
  <script src="bookcase.js"></script>
  <script src="app.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="js/stage/boot.js"></script>
</body>
</html>
